[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "Machine learning project for credit card fraud detection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imbalanced-learn==0.12.3",
    "joblib==1.5.3",
    "matplotlib==3.9.1",
    "mlxtend==0.23.1",
    "numpy==2.1.3",
    "pandas==2.2.2",
    "PyYAML==6.0.1",
    "scikit-learn==1.6.1",
    "scipy==1.14.0",
    "seaborn==0.13.2",
    "tabulate==0.9.0",
    "torch==2.3.1",
    "tensorboard==2.17.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "skl2onnx==1.20.0",
    "onnx==1.22.0",
    "onnxruntime==1.20.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
