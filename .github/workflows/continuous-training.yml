name: Continuous Training

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      data_version:
        description: "DVC data version / tag to train on (optional, defaults to main)"
        required: false
        default: ""
  repository_dispatch:
    # Fired by Module 5's drift detector once it exists. Left wired now so
    # nothing needs to change here later — just the caller.
    types: [drift-detected]

jobs:
  train-and-gate:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.data_version || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - run: pip install -e ".[dev]"

      - name: Configure DVC remote credentials
        run: |
          dvc remote modify --local storage access_key_id "${{ secrets.DVC_ACCESS_KEY_ID }}"
          dvc remote modify --local storage secret_access_key "${{ secrets.DVC_SECRET_ACCESS_KEY }}"

      - name: dvc pull
        run: dvc pull

      - name: Train (reproduces the full DVC pipeline)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: dvc repro -f pipelines/dvc.yaml

      - name: Evaluate
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: cat reports/metrics.json

      - name: Promotion gate — Staging only if candidate beats Production
        id: gate
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          RUN_ID=$(cat reports/last_run_id.txt)
          python -m src.registry promote-if-better \
            --run-id "$RUN_ID" \
            --name fraud-detector \
            --metric pr_auc \
            --margin 0.0 \
            --stage Staging
        # promote_if_better exits 0 either way — "failed challenge" is not a
        # build failure, per the handbook. Success/failure is read from the
        # printed reason above, captured in the job summary.

      - name: Notify
        if: always()
        run: |
          echo "### Continuous Training run" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat reports/metrics.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build-image:
    runs-on: ubuntu-latest
    needs: train-and-gate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection-api:ct-${{ github.run_number }}

  approve-production:
    runs-on: ubuntu-latest
    needs: build-image
    environment:
      name: production-promotion # requires a human to click "Review deployments" in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e .
      - name: Promote Staging model to Production (human-approved)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          RUN_ID=$(cat reports/last_run_id.txt)
          python -m src.registry promote-if-better \
            --run-id "$RUN_ID" --name fraud-detector --metric pr_auc \
            --margin 0.0 --stage Production

# Design note (Step 7): Staging promotion above is fully automatic — a
# candidate that beats Production on pr_auc moves to Staging with no human
# involved. Production promotion requires a human to approve the
# 'production-promotion' GitHub Environment. Two reasons: (1) pr_auc on a
# held-out split doesn't capture every failure mode (latency, drift in
# upstream features, a change in transaction volume patterns) that only
# shows up once serving traffic hits it in Staging; (2) an automatic
# Friday-night Production promotion with no human check is exactly the
# silently-broken-model-ships scenario the handbook's failure-modes table
# warns about.
