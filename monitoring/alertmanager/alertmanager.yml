global:
  resolve_timeout: 5m

route:
  receiver: "local"
  group_by: ["service", "alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity="critical"
      receiver: "local"
      group_wait: 10s
      repeat_interval: 1h

    - matchers:
        - severity="warning"
      receiver: "local"

    - matchers:
        - severity="info"
      receiver: "local"
      repeat_interval: 24h

inhibit_rules:
  - source_matchers:
      - alertname="FraudAPIServiceDown"
    target_matchers:
      - alertname=~"FraudAPIHighLatency|FraudAPIHighErrorRate|FraudAPISLOBurnRateFast|FraudAPISLOBurnRateSlow"

receivers:
  - name: "local"