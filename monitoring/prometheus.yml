global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/recording.yml
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The fraud-detection FastAPI service — our own /metrics endpoint.
  - job_name: "fraud-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "fraud-api"
          env: "dev"

  # Host CPU / RAM / disk / network.
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: "dev"

  # Per-container CPU / memory / throttling.
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          env: "dev"

  # Blackbox probe: the only exporter that tells you the service is down
  # when the service is actually down (the others can't scrape a dead target).
  - job_name: "blackbox-fraud-api"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:8000/health"]
    relabel_configs:
      # rewrite the label so the graph shows the probed URL, not the
      # blackbox-exporter's own address
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Prometheus's own self-scrape.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # kube-state-metrics is documented here even though this stack is plain
  # Compose, not Kubernetes: if/when this ships to a cluster, add a job
  # pointing at kube-state-metrics:8080 and nothing else in this file changes.